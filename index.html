<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partagez vos photos</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f4f0;color:#222;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.container{width:100%;max-width:560px}
.card{background:#fff;border-radius:24px;padding:30px 22px;text-align:center;box-shadow:0 15px 50px rgba(0,0,0,.1)}
.logo{width:100px;height:100px;border-radius:50%;object-fit:cover;margin-bottom:12px}
h1{margin:5px 0 10px;font-size:29px}
.subtitle{color:#777;line-height:1.5;margin-bottom:22px}
.input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px;margin-bottom:14px}
.upload-box{display:block;border:2px dashed #ddd;border-radius:15px;padding:24px 12px;cursor:pointer}
.upload-icon{font-size:38px}
.upload-text{font-weight:bold;margin:7px 0}
.upload-info{font-size:13px;color:#888}
#files{display:none}
#fileCount{font-size:14px;color:#666;margin:12px 0}
#preview{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:15px 0}
.thumb{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:#eee}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb span{position:absolute;bottom:3px;left:3px;background:rgba(0,0,0,.65);color:#fff;font-size:10px;padding:2px 4px;border-radius:4px}
button{width:100%;padding:16px;border:0;border-radius:12px;background:#222;color:#fff;font-size:17px;font-weight:bold;cursor:pointer;margin-top:8px}
button:disabled{opacity:.5;cursor:wait}
.progress-container{display:none;margin-top:18px}
.progress-background{height:9px;background:#eee;border-radius:10px;overflow:hidden}
.progress-bar{height:100%;width:0;background:#222;transition:width .2s}
.progress-text{font-size:13px;color:#777;margin-top:8px}
#status{margin-top:17px;font-weight:bold;line-height:1.4}
.success{color:#218838}.error{color:#c82333}
.footer{margin-top:18px;color:#999;font-size:12px}
</style>
</head>
<body>
<div class="container">
<div class="card">

<img src="logo.jpg" class="logo" alt="Logo">

<h1>Partagez vos photos 📸</h1>
<div class="subtitle">Envoyez vos souvenirs simplement et rapidement ❤️</div>

<input id="name" class="input" type="text" placeholder="Votre prénom (facultatif)">

<label for="files" class="upload-box">
<div class="upload-icon">📷</div>
<div class="upload-text">Sélectionner vos photos</div>
<div class="upload-info">Les fichiers originaux sont conservés sans compression</div>
</label>

<input id="files" type="file" accept="image/*" multiple>

<div id="fileCount"></div>
<div id="preview"></div>

<button id="sendBtn" onclick="uploadFiles()">Envoyer mes photos</button>

<div id="progressContainer" class="progress-container">
<div class="progress-background">
<div id="progressBar" class="progress-bar"></div>
</div>
<div id="progressText" class="progress-text">Préparation...</div>
</div>

<div id="status"></div>
<div class="footer">Vos photos sont envoyées sans compression ❤️</div>

</div>
</div>

<script>
const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzTKeNze5zdGFvi7g_fCuEaseQm2x0jYzpsUi1rpiQWpO5peuT6pON3tIKCuvYLXwtzdA/exec";

const filesInput = document.getElementById("files");
const fileCount = document.getElementById("fileCount");
const preview = document.getElementById("preview");

filesInput.addEventListener("change", function(){

  const files = [...this.files];

  fileCount.textContent = files.length
    ? files.length + " photo" + (files.length > 1 ? "s" : "") +
      " sélectionnée" + (files.length > 1 ? "s" : "")
    : "";

  preview.innerHTML = "";

  files.forEach(file => {

    const box = document.createElement("div");
    box.className = "thumb";

    const img = document.createElement("img");
    img.src = URL.createObjectURL(file);

    img.onload = function(){
      URL.revokeObjectURL(img.src);
    };

    box.appendChild(img);

    const size = document.createElement("span");
    size.textContent = formatSize(file.size);
    box.appendChild(size);

    preview.appendChild(box);
  });
});


async function uploadFiles(){

  const files = [...filesInput.files];
  const name = document.getElementById("name").value.trim();

  const button = document.getElementById("sendBtn");
  const status = document.getElementById("status");

  const progressContainer =
    document.getElementById("progressContainer");

  const progressBar =
    document.getElementById("progressBar");

  const progressText =
    document.getElementById("progressText");


  if(!files.length){

    status.className = "error";
    status.textContent = "Sélectionnez au moins une photo.";
    return;
  }


  button.disabled = true;
  status.className = "";
  status.textContent = "";

  progressContainer.style.display = "block";
  progressBar.style.width = "0%";


  try{

    for(let i = 0; i < files.length; i++){

      const file = files[i];

      progressText.textContent =
        "Préparation de la photo " +
        (i + 1) +
        " / " +
        files.length +
        "…";


      /*
       * IMPORTANT :
       * Aucun canvas.
       * Aucun redimensionnement.
       * Aucune compression.
       * Aucun changement de format.
       *
       * Le fichier original est lu directement.
       */

      const base64 =
        await fileToBase64(file);


      progressText.textContent =
        "Envoi de la photo " +
        (i + 1) +
        " / " +
        files.length +
        "…";


      await fetch(
        GOOGLE_SCRIPT_URL,
        {
          method: "POST",
          mode: "no-cors",
          body: JSON.stringify({

            fileName: file.name,

            mimeType:
              file.type || "application/octet-stream",

            data: base64,

            guestName: name

          })
        }
      );


      const percentage =
        Math.round(
          ((i + 1) / files.length) * 100
        );

      progressBar.style.width =
        percentage + "%";
    }


    status.className = "success";

    status.textContent =
      "Merci ❤️ Vos photos ont bien été envoyées !";


    filesInput.value = "";
    fileCount.textContent = "";
    preview.innerHTML = "";
    document.getElementById("name").value = "";


  }catch(error){

    console.error(error);

    status.className = "error";

    status.textContent =
      "Une erreur est survenue pendant l'envoi. Veuillez réessayer.";

  }


  button.disabled = false;
}


function fileToBase64(file){

  return new Promise((resolve, reject) => {

    const reader = new FileReader();

    reader.onload = function(){

      resolve(
        reader.result.split(",")[1]
      );

    };

    reader.onerror = function(){

      reject(
        new Error("Impossible de lire le fichier.")
      );

    };

    reader.readAsDataURL(file);

  });
}


function formatSize(bytes){

  if(bytes < 1024 * 1024){

    return Math.round(bytes / 1024) + " Ko";

  }

  return (
    bytes / (1024 * 1024)
  ).toFixed(1) + " Mo";
}
</script>

</body>
</html>
