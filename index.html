<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guillaume & Coleen — 28 août 2027</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#3d3835;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;padding:18px;background-image:linear-gradient(rgba(248,244,239,.62),rgba(248,244,239,.62)),url('logo.jpg');background-size:cover;background-position:center;background-attachment:fixed}.card{width:100%;max-width:560px;background:#fffdfb;border:1px solid #e8ddd3;border-radius:30px;padding:34px 22px;text-align:center;box-shadow:0 18px 60px #00000012}.monogram{width:76px;height:76px;margin:auto auto 16px;border:1px solid #b9a18d;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#8b705c;font:28px Georgia,serif}.kicker{text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#9a806c}.names{font:500 48px/1 Georgia,serif;margin:10px 0}.date{font:24px Georgia,serif;color:#8b705c;margin-top:12px}.divider{width:55px;height:1px;background:#c9b7a6;margin:22px auto}.message{font-size:14px;line-height:1.7;color:#706762;margin-bottom:20px}.name{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:14px;margin-bottom:12px}.upload{display:block;border:1.5px dashed #c8b8a9;border-radius:20px;padding:22px 12px;cursor:pointer;background:#fffaf6}.upload b{display:block;margin:7px 0}.upload small{color:#91867f}.files{display:none}#count{font-size:12px;color:#8a7c72;margin:12px}#preview{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0 17px}.thumb{aspect-ratio:1;position:relative;overflow:hidden;border-radius:10px;background:#eee}.thumb img{width:100%;height:100%;object-fit:cover}.thumb span{position:absolute;bottom:4px;left:4px;background:#000a;color:#fff;font-size:9px;padding:3px;border-radius:4px}button{width:100%;padding:16px;border:0;border-radius:15px;background:#4c433d;color:#fff;font-size:13px;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.progress{display:none;margin-top:18px}.track{height:7px;background:#eee7e1;border-radius:10px;overflow:hidden}.bar{height:100%;width:0;background:#9a806c}.pt{font-size:11px;color:#8a7d74;margin-top:8px}#status{margin-top:17px;font-size:14px;line-height:1.6}.ok{color:#657a61}.err{color:#a35d57}.footer{margin-top:22px;font:17px Georgia,serif;color:#9a806c}
</style></head><body><main class="card">
<div class="monogram">G & C</div><div class="kicker">Notre mariage</div><div class="names">Guillaume & Coleen</div><div class="date">28 août 2027</div><div class="divider"></div>
<div class="message">Vous avez capturé un joli moment pendant cette journée ?<br>Partagez vos photos avec nous et participez à nos souvenirs. ❤️</div>
<input id="name" class="name" placeholder="Votre prénom (facultatif)">
<label class="upload" for="files"><div style="font-size:30px">📷</div><b>Ajouter mes photos</b><small>Une ou plusieurs photos • qualité originale</small></label>
<input id="files" class="files" type="file" accept="image/*" multiple><div id="count"></div><div id="preview"></div>
<button id="send">❤️ ENVOYER MES SOUVENIRS</button>
<div id="progress" class="progress"><div class="track"><div id="bar" class="bar"></div></div><div id="pt" class="pt"></div></div>
<div id="status"></div><div class="footer">Merci de faire partie de cette belle journée</div>
</main>
<script>
const URL_SCRIPT="https://script.google.com/macros/s/AKfycbzTKeNze5zdGFvi7g_fCuEaseQm2x0jYzpsUi1rpiQWpO5peuT6pON3tIKCuvYLXwtzdA/exec";
const input=document.getElementById("files"),preview=document.getElementById("preview");
input.onchange=()=>{let f=[...input.files];document.getElementById("count").textContent=f.length?f.length+" photo"+(f.length>1?"s":"")+" sélectionnée"+(f.length>1?"s":""):"";preview.innerHTML="";f.forEach(x=>{let d=document.createElement("div");d.className="thumb";let i=document.createElement("img");i.src=URL.createObjectURL(x);d.appendChild(i);let s=document.createElement("span");s.textContent=x.size<1048576?Math.round(x.size/1024)+" Ko":(x.size/1048576).toFixed(1)+" Mo";d.appendChild(s);preview.appendChild(d)})};
document.getElementById("send").onclick=async()=>{let files=[...input.files],name=document.getElementById("name").value.trim(),btn=document.getElementById("send"),status=document.getElementById("status"),prog=document.getElementById("progress"),bar=document.getElementById("bar"),pt=document.getElementById("pt");if(!files.length){status.className="err";status.textContent="Choisissez au moins une photo ❤️";return}btn.disabled=true;prog.style.display="block";try{for(let n=0;n<files.length;n++){let f=files[n];pt.textContent="Préparation de la photo "+(n+1)+" / "+files.length+"…";let b=await base64(f);pt.textContent="Envoi de la photo "+(n+1)+" / "+files.length+"…";await fetch(URL_SCRIPT,{method:"POST",mode:"no-cors",body:JSON.stringify({fileName:f.name,mimeType:f.type||"application/octet-stream",data:b,guestName:name})});bar.style.width=Math.round((n+1)/files.length*100)+"%"}status.className="ok";status.innerHTML="<b>Merci ❤️</b><br>Vos photos ont bien été ajoutées aux souvenirs de Guillaume & Coleen.";input.value="";preview.innerHTML="";document.getElementById("count").textContent="";document.getElementById("name").value=""}catch(e){console.error(e);status.className="err";status.textContent="L'envoi n'a pas pu être terminé. Veuillez réessayer."}btn.disabled=false};
function base64(f){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result.split(",")[1]);r.onerror=no;r.readAsDataURL(f)})}
</script></body></html>
