<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partagez vos photos</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f4f0;color:#222;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.container{width:100%;max-width:520px}.card{background:#fff;border-radius:24px;padding:35px 25px;text-align:center;box-shadow:0 15px 50px rgba(0,0,0,.1)}
.logo{width:100px;height:100px;border-radius:50%;object-fit:cover;margin-bottom:15px}
h1{margin:5px 0 10px;font-size:30px;font-weight:600}.subtitle{color:#777;font-size:16px;line-height:1.5;margin-bottom:25px}
.input{width:100%;padding:14px 15px;border:1px solid #ddd;border-radius:12px;font-size:16px;outline:none;margin-bottom:15px}
.upload-box{display:block;border:2px dashed #ddd;border-radius:15px;padding:25px 15px;margin-bottom:15px;cursor:pointer}
.upload-box:hover{border-color:#999;background:#fafafa}.upload-icon{font-size:40px;margin-bottom:8px}.upload-text{font-weight:bold;margin-bottom:5px}.upload-info{color:#888;font-size:13px}
#files{display:none}#fileList{text-align:left;margin:15px 0;font-size:14px}.file{background:#f5f5f5;padding:8px 10px;border-radius:8px;margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{width:100%;padding:16px;border:0;border-radius:12px;background:#222;color:#fff;font-size:17px;font-weight:bold;cursor:pointer}button:disabled{opacity:.5;cursor:wait}
.progress-container{display:none;margin-top:20px}.progress-background{width:100%;height:8px;background:#eee;border-radius:10px;overflow:hidden}.progress-bar{width:0;height:100%;background:#222;transition:width .2s}.progress-text{font-size:13px;color:#777;margin-top:8px}
#status{margin-top:18px;font-weight:bold;line-height:1.4}.success{color:#218838}.error{color:#c82333}.footer{margin-top:20px;font-size:12px;color:#999}
</style>
</head>
<body>
<div class="container"><div class="card">
<img src="logo.jpg" class="logo" alt="Logo">
<h1>Partagez vos photos 📸</h1>
<div class="subtitle">Partagez vos plus beaux souvenirs avec nous !</div>
<input id="name" class="input" type="text" placeholder="Votre prénom (facultatif)">
<label for="files" class="upload-box">
<div class="upload-icon">📷</div>
<div class="upload-text">Sélectionner vos photos</div>
<div class="upload-info">Photos et vidéos • Plusieurs fichiers possibles</div>
</label>
<input id="files" type="file" accept="image/*,video/*" multiple>
<div id="fileList"></div>
<button id="sendBtn" onclick="uploadFiles()">Envoyer mes photos</button>
<div id="progressContainer" class="progress-container">
<div class="progress-background"><div id="progressBar" class="progress-bar"></div></div>
<div id="progressText" class="progress-text">Préparation...</div>
</div>
<div id="status"></div>
<div class="footer">Merci de partager vos souvenirs ❤️</div>
</div></div>

<script>
const GOOGLE_SCRIPT_URL="https://script.google.com/macros/s/AKfycbzTKeNze5zdGFvi7g_fCuEaseQm2x0jYzpsUi1rpiQWpO5peuT6pON3tIKCuvYLXwtzdA/exec";

document.getElementById("files").addEventListener("change",function(){
 const list=document.getElementById("fileList"); list.innerHTML="";
 for(const file of this.files){const div=document.createElement("div");div.className="file";div.textContent="📎 "+file.name;list.appendChild(div);}
});

async function uploadFiles(){
 const files=document.getElementById("files").files;
 const name=document.getElementById("name").value.trim();
 const button=document.getElementById("sendBtn");
 const status=document.getElementById("status");
 const pc=document.getElementById("progressContainer");
 const bar=document.getElementById("progressBar");
 const text=document.getElementById("progressText");

 if(!files.length){status.className="error";status.textContent="Sélectionnez au moins une photo.";return;}
 button.disabled=true;status.className="";status.textContent="";pc.style.display="block";

 try{
  for(let i=0;i<files.length;i++){
   const file=files[i]; text.textContent="Envoi de "+(i+1)+" / "+files.length+" : "+file.name;
   const base64=await fileToBase64(file);
   const data={fileName:file.name,mimeType:file.type,data:base64,guestName:name};
   await fetch(GOOGLE_SCRIPT_URL,{method:"POST",mode:"no-cors",body:JSON.stringify(data)});
   bar.style.width=Math.round(((i+1)/files.length)*100)+"%";
  }
  status.className="success";status.textContent="Merci ❤️ Vos photos ont bien été envoyées !";
  document.getElementById("files").value="";document.getElementById("fileList").innerHTML="";document.getElementById("name").value="";
 }catch(error){
  console.error(error);status.className="error";status.textContent="Une erreur est survenue pendant l'envoi. Veuillez réessayer.";
 }
 button.disabled=false;
}

function fileToBase64(file){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=()=>resolve(reader.result.split(",")[1]);
  reader.onerror=reject;
  reader.readAsDataURL(file);
 });
}
</script>
</body>
</html>
